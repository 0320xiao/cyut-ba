<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朝陽科技大學企業管理系</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <!-- 導覽列 -->
  <header class="bg-red-600 text-white p-4">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">朝陽科技大學企業管理系</h1>
      <nav>
        <a href="#about" class="mx-2 hover:underline">關於我們</a>
        <a href="#form" class="mx-2 hover:underline">建議提案</a>
        <a href="#contact" class="mx-2 hover:underline">聯絡</a>
      </nav>
    </div>
  </header>

  <!-- 簡介區 -->
  <section id="about" class="py-12 px-6 bg-white">
    <div class="max-w-3xl mx-auto text-center">
      <h2 class="text-2xl font-semibold mb-4">我們是誰？</h2>
      <p>
        朝陽科技大學企業管理系學會，致力於服務企管系學生、舉辦各類活動、推動校園生活與溝通橋樑。
        如果你有任何建議或疑問，歡迎透過下方表單與我們聯絡！
      </p>
    </div>
  </section>

  <!-- 表單區 -->
  <section id="form" class="py-12 px-6 bg-gray-100">
    <div class="max-w-2xl mx-auto">
      <h2 class="text-xl font-semibold mb-4 text-center">建議反映 / 問題提議</h2>
      <form class="bg-white p-6 rounded-lg shadow-md space-y-4">
        <div>
          <label class="block text-sm font-medium">學號（各資問題皆保密，僅用於驗證是否為本校學生）</label>
          <input type="text" class="w-full border border-gray-300 rounded p-2" placeholder="請輸入您的學號">
        </div>
        <div>
          <label class="block text-sm font-medium">建議或問題內容</label>
          <textarea rows="4" class="w-full border border-gray-300 rounded p-2" placeholder="請寫下您的建議、問題或想說的話"></textarea>
        </div>
        <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">送出</button>
      </form>
    </div>
  </section>

  <!-- 聯絡區 -->
  <section id="contact" class="py-12 px-6 bg-white">
    <div class="max-w-3xl mx-auto text-center">
      <h2 class="text-xl font-semibold mb-4">聯絡我們</h2>
      <p>如果有進一步的建議，歡迎透過 <a href="mailto:student@cyut.edu.tw" class="text-red-600 underline">student@cyut.edu.tw</a> 與我們聯繫，或加入我們的 IG：@cyut_dept</p>
    </div>
  </section>

  <footer class="text-center text-sm text-gray-500 py-4">
    © 2025 朝陽科技大學企業管理系
  </footer>
</body>
</html>
